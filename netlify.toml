# Netlify — site statique, aucune étape de build.
[build]
  publish = "."
  command = ""

# En-têtes de sécurité pour toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# CSS / JS : noms de fichiers non versionnés, on garde un cache court
# revalidé pour que chaque déploiement soit visible immédiatement.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Third-party engine and fonts never change between deploys: cache them for a year
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fichiers d'outillage (skills pour agents IA) : présents dans le dépôt, jamais servis
[[redirects]]
  from = "/.agents/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/skills-lock.json"
  to = "/404"
  status = 404
  force = true
